<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="112" height="84" role="img" aria-label="Pipeline stages flowing to deploy">
<style>
.bg{fill:#f6f0ff}
.s{fill:none;stroke:#8250df;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#8250df}
.pulse{animation:p 3s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:d 1.6s linear infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-color-scheme:dark){.bg{fill:#261c3d}.s{stroke:#d2a8ff}.f{fill:#d2a8ff}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<rect class="bg" width="112" height="84" rx="10"/>
<g transform="translate(8 6)">
<circle class="s" cx="16" cy="36" r="8"/><circle class="s" cx="48" cy="36" r="8"/><circle class="s" cx="80" cy="36" r="8"/><path class="s flow" d="M24 36h16M56 36h16"/>
<path class="s" d="M13 36l2 2 4-4M45 36l2 2 4-4"/><path class="s" d="M77 33v6M80 33v6M83 33v6"/><path class="s" stroke-dasharray="2 3" d="M48 16c18 0 32 4 32 12M48 56c-18 0-32-4-32-12"/>
</g>
</svg>
