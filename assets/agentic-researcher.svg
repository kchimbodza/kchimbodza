<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="112" height="84" role="img" aria-label="Agents connected in a graph">
<style>
.bg{fill:#f3eefe}
.s{fill:none;stroke:#7c3aed;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#7c3aed}
.pulse{animation:p 3s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:d 1.6s linear infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-color-scheme:dark){.bg{fill:#2a1f45}.s{stroke:#c4b5fd}.f{fill:#c4b5fd}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<rect class="bg" width="112" height="84" rx="10"/>
<g transform="translate(8 6)">
<circle class="s" cx="48" cy="14" r="7"/><circle class="s" cx="18" cy="52" r="7"/><circle class="s" cx="48" cy="58" r="7"/><circle class="s" cx="78" cy="52" r="7"/>
<path class="s flow" d="M43 20 22 46M48 21v30M53 20l21 26"/><path class="s" d="M25 54h16M55 56l16-3"/><circle class="f pulse" cx="48" cy="14" r="2.5"/>
</g>
</svg>
