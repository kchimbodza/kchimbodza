<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="112" height="84" role="img" aria-label="A document with a highlighted line under a magnifier">
<style>
.bg{fill:#eef5ff}
.s{fill:none;stroke:#0969da;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#0969da}
.pulse{animation:p 3s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:d 1.6s linear infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-color-scheme:dark){.bg{fill:#13233a}.s{stroke:#79b8ff}.f{fill:#79b8ff}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<rect class="bg" width="112" height="84" rx="10"/>
<g transform="translate(8 6)">
<path class="s" d="M22 8h32l12 12v44H22z"/><path class="s" d="M54 8v12h12"/><path class="s" d="M30 30h26M30 38h26M30 46h18"/>
<rect class="f pulse" x="28" y="34.5" width="30" height="7" rx="2" fill-opacity=".2"/><circle class="s" cx="66" cy="50" r="9"/><path class="s" d="M73 57l7 7"/>
</g>
</svg>
