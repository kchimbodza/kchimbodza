<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="112" height="84" role="img" aria-label="A camera frame detecting a person">
<style>
.bg{fill:#eefbf1}
.s{fill:none;stroke:#1a7f37;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#1a7f37}
.pulse{animation:p 3s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:d 1.6s linear infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-color-scheme:dark){.bg{fill:#12291a}.s{stroke:#6fdd8b}.f{fill:#6fdd8b}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<rect class="bg" width="112" height="84" rx="10"/>
<g transform="translate(8 6)">
<rect class="s" x="14" y="14" width="68" height="44" rx="5"/><rect class="s pulse" x="40" y="22" width="18" height="28" rx="2" stroke-dasharray="3 3"/>
<circle class="s" cx="49" cy="29" r="3"/><path class="s" d="M49 32v8M44 36h10M46 46l3-6 3 6"/><circle class="pulse" cx="74" cy="20" r="2" fill="#cf222e"/>
</g>
</svg>
