<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="112" height="84" role="img" aria-label="A network around a security shield">
<style>
.bg{fill:#ecfafd}
.s{fill:none;stroke:#0e7490;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#0e7490}
.pulse{animation:p 3s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:d 1.6s linear infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-color-scheme:dark){.bg{fill:#0f2a30}.s{stroke:#67e8f9}.f{fill:#67e8f9}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<rect class="bg" width="112" height="84" rx="10"/>
<g transform="translate(8 6)">
<rect class="s" x="10" y="10" width="20" height="14" rx="2"/><rect class="s" x="66" y="10" width="20" height="14" rx="2"/><rect class="s" x="10" y="48" width="20" height="14" rx="2"/><rect class="s" x="66" y="48" width="20" height="14" rx="2"/>
<path class="s flow" d="M30 17h36M20 24v24M76 24v24M30 55h36"/><path class="s" d="M48 26l10 4v7c0 6-4 9-10 11-6-2-10-5-10-11v-7z"/><path class="s" d="M44 37l3 3 6-6"/>
</g>
</svg>
