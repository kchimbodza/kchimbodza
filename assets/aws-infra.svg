<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="112" height="84" role="img" aria-label="A cloud adding servers">
<style>
.bg{fill:#fff0f0}
.s{fill:none;stroke:#d1242f;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#d1242f}
.pulse{animation:p 3s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:d 1.6s linear infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-color-scheme:dark){.bg{fill:#331515}.s{stroke:#ff8182}.f{fill:#ff8182}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<rect class="bg" width="112" height="84" rx="10"/>
<g transform="translate(8 6)">
<path class="s" d="M30 30a12 12 0 0 1 23-6 10 10 0 0 1 15 9 8 8 0 0 1-1 16H31a10 10 0 0 1-1-19z"/><rect class="s" x="22" y="54" width="14" height="10" rx="1.5"/>
<rect class="s" x="41" y="54" width="14" height="10" rx="1.5"/><rect class="s pulse" x="60" y="54" width="14" height="10" rx="1.5" stroke-dasharray="3 2"/><path class="s" d="M29 49v5M48 49v5M67 49v5"/>
</g>
</svg>
