<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 84" width="112" height="84" role="img" aria-label="Radar waves from a ceiling sensor over a person">
<style>
.bg{fill:#fff4ec}
.s{fill:none;stroke:#bc4c00;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.f{fill:#bc4c00}
.pulse{animation:p 3s ease-in-out infinite}
.flow{stroke-dasharray:4 4;animation:d 1.6s linear infinite}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes d{to{stroke-dashoffset:-16}}
@media (prefers-color-scheme:dark){.bg{fill:#33200f}.s{stroke:#ffa657}.f{fill:#ffa657}}
@media (prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
</style>
<rect class="bg" width="112" height="84" rx="10"/>
<g transform="translate(8 6)">
<path class="s" d="M12 8h72"/><rect class="s" x="40" y="8" width="16" height="6" rx="1.5"/><path class="s pulse" d="M36 22a16 16 0 0 0 24 0"/>
<path class="s pulse" style="animation-delay:.5s" d="M30 30a24 24 0 0 0 36 0"/><circle class="s" cx="48" cy="46" r="3"/><path class="s" d="M48 49v8M43 53h10M45 64l3-7 3 7"/><path class="s" d="M12 66h72"/>
</g>
</svg>
